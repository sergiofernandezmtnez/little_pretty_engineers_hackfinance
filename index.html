<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STUD€NTIA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Concepto: cuaderno de cuentas del estudiante. El "ticket de hoy" es la pieza central, el marcador amarillo subraya la cifra clave y el color de acento cambia con el modo (supervivencia, ajustado, holgado). */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#0E1629; --muted:#56627F; --line:#D6DCEA;
  --accent-s:#D8381B; --accent-s-soft:#FBE3DD;
  --accent-a:#2B3FF0; --accent-a-soft:#E3E7FE;
  --accent-h:#0A8F66; --accent-h-soft:#D9F2E8;
  --accent:#2B3FF0; --accent-soft:#E3E7FE; --on-accent:#FFFFFF;
  --mark:#FFE24A; --on-mark:#1A1700;
  --ok:#0B8A5E; --ok-soft:#DDF3EA; --warn:#B86A00; --warn-soft:#FBEBD0; --bad:#D3341F; --bad-soft:#FBE0DB; --on-bad:#FFFFFF;
  --shadow:0 1px 0 rgba(14,22,41,.04),0 10px 26px -14px rgba(14,22,41,.22);
  --scrim:rgba(8,12,24,.55);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1F; --surface:#121A30; --surface-2:#18213C; --ink:#E9EDFB; --muted:#9AA6C6; --line:#25304F;
  --accent-s:#FF8164; --accent-s-soft:#3A1F1B; --accent-a:#8E9BFF; --accent-a-soft:#1D2450; --accent-h:#3FD6A2; --accent-h-soft:#123A2E;
  --on-accent:#0A0F1F; --ok:#3FD6A2; --ok-soft:#12362B; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#FF7A66; --bad-soft:#3D1E1A; --on-bad:#1B0805;
  --shadow:0 12px 28px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1F; --surface:#121A30; --surface-2:#18213C; --ink:#E9EDFB; --muted:#9AA6C6; --line:#25304F;
  --accent-s:#FF8164; --accent-s-soft:#3A1F1B; --accent-a:#8E9BFF; --accent-a-soft:#1D2450; --accent-h:#3FD6A2; --accent-h-soft:#123A2E;
  --on-accent:#0A0F1F; --ok:#3FD6A2; --ok-soft:#12362B; --warn:#F0B04A; --warn-soft:#3A2C12; --bad:#FF7A66; --bad-soft:#3D1E1A; --on-bad:#1B0805;
  --shadow:0 12px 28px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.65); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,46px);font-weight:800}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hl{background:var(--mark);color:var(--on-mark);padding:0 .14em;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{color:var(--muted);max-width:62ch}
.hint{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* controles */
.btn{font:600 14px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sos{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
.f{display:grid;gap:4px;min-width:0}
.f>span{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.02em}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.tag{cursor:default;padding:3px 10px;font-size:12px;background:var(--surface-2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 12px var(--f-body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.panel>h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{font:800 24px var(--f-display);color:var(--ink);text-decoration:none;flex:1 1 auto;letter-spacing:-.02em}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-b{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 12px;border-radius:7px;cursor:pointer}
.seg-b[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 12px;color:var(--muted);text-decoration:none;font:600 14px var(--f-body);border-bottom:3px solid transparent;white-space:nowrap}
.nb{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px var(--f-body);vertical-align:middle}
.alertp{border:2px solid var(--accent)}
.jump{display:flex;gap:8px;flex-wrap:wrap}
.mycode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.mycode strong{font-size:22px;letter-spacing:.06em}
.tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:640px){.seg{order:3;width:100%}.seg-b{flex:1;padding-inline:4px}}
.main{padding-block:24px 28px;display:grid;gap:22px;align-content:start}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:grid;gap:20px;min-width:0}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
footer.foot{border-top:1px solid var(--line);padding-block:20px calc(28px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px}
footer.foot .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer.foot p{max-width:80ch}

/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;box-shadow:var(--shadow);font-family:var(--f-mono)}
.tk-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;border-bottom:1px dashed var(--muted)}
.tk-lines{margin:0;padding:10px 0}
.tk-lines div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.tk-lines dt{color:var(--muted)}
.tk-lines dd{margin:0;font-weight:500}
.tk-total{border-top:1px dashed var(--muted);padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tk-total span{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk-total strong{font:800 clamp(40px,9vw,64px)/1.05 var(--f-display);letter-spacing:-.03em}
.tk-foot{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--f-body);font-size:13px;color:var(--muted)}
.banner{border:1px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:12px 16px;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* gastos y gráficos */
.qa-row{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,110px) auto;gap:10px;align-items:end}
@media (max-width:760px){.qa-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qa-row .grow,.qa-row .btn{grid-column:1/-1}}
.list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .l{min-width:0}
.list .l small{display:block;color:var(--muted)}
.bars{display:grid;gap:10px}
.bar-r{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,2fr) 76px;gap:10px;align-items:center;font-size:14px}
.bar-t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-t i{display:block;height:100%;background:var(--accent)}
.bar-t i.frz{background:var(--bad)}
svg.ch{width:100%;height:auto;display:block}
svg.ch .tx{fill:var(--muted);font:11px var(--f-mono)}
svg.ch .tx.b{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--muted)}

/* tarjeta */
.vcard{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:16px 18px;display:grid;gap:18px;font-family:var(--f-mono);position:relative;max-width:360px}
.vcard.blocked{background:var(--bad);color:var(--on-bad)}
.vc-top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.vc-num{font-size:20px;letter-spacing:.12em}
.vc-chip{width:34px;height:24px;border-radius:5px;border:2px solid currentColor;opacity:.7}

/* catálogo oficial */
.cat-i{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.cat-list .cat-i:first-child{border-top:0}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat-top strong{min-width:0}
.cat-meta{color:var(--muted);font-size:13px}
.cat-i details summary{cursor:pointer;font-weight:600;font-size:13px}
.cat-i details p{margin:6px 0 0;font-size:13px}
/* ayudas */
.deck{position:relative;height:500px;max-width:460px;width:100%;margin-inline:auto}
.sc{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;overflow:auto;touch-action:pan-y;box-shadow:var(--shadow)}
.sc.ghost{overflow:hidden}
.sc[data-i="1"]{transform:translateY(10px) scale(.96);opacity:.9}
.sc[data-i="2"]{transform:translateY(20px) scale(.92);opacity:.7}
.swipe-top{cursor:grab;user-select:none;-webkit-user-select:none;z-index:3;transition:transform .2s ease,opacity .2s ease}
.swipe-top.drag{transition:none;cursor:grabbing}
.swipe-top[data-dir]::after{position:absolute;top:14px;right:14px;font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:6px;border:2px solid currentColor}
.swipe-top[data-dir="r"]::after{content:"Guardar";color:var(--ok)}
.swipe-top[data-dir="l"]::after{content:"Descartar";color:var(--bad);right:auto;left:14px}
.sc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ring{--p:80;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;margin-left:auto}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 12px var(--f-mono)}
.sc-imp{font-weight:600;color:var(--accent)}
.sc-d{font-size:14px}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.reasons li{display:flex;gap:8px}
.reasons li.y span{color:var(--ok);font-weight:700}
.reasons li.n{color:var(--muted)}
.sc details{font-size:13px}
.sc summary{cursor:pointer;font-weight:600;color:var(--accent)}
.sc ol{margin:8px 0 0;padding-left:20px}
.decide{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}

/* calendario */
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font:600 12px var(--f-body);color:var(--muted);text-align:center;padding:4px 0}
.cd{min-height:48px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 2px;display:grid;align-content:space-between;justify-items:center;font:500 13px var(--f-mono);color:var(--ink);cursor:pointer}
.cd.off{visibility:hidden}
.cd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cd[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dots{display:flex;gap:3px;min-height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dot.gasto{background:var(--bad)}.dot.ingreso{background:var(--ok)}.dot.ayuda{background:var(--accent)}.dot.reto{background:var(--warn)}
.cd[aria-pressed=true] .dot{box-shadow:0 0 0 1px var(--on-accent)}
.kind{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--muted)}
.num.ok,.num.pos{color:var(--ok)}.num.warn{color:var(--warn)}.num.neg{color:var(--bad)}
.qa-row.inc{grid-template-columns:minmax(0,110px) minmax(0,1.1fr) minmax(0,1.6fr) auto}
@media (max-width:760px){.qa-row.inc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.flow{column-count:2;column-gap:20px}.flow>*{break-inside:avoid;margin:0 0 20px}
@media (max-width:900px){.flow{column-count:1}}
.plan-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}.plan-strip>div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}.plan-strip strong{font-size:20px}
.mv-tabs{display:flex;gap:6px}
.chip.inc[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--on-bad)}
.list .inc{color:var(--ok)}
.kind.gasto{background:var(--bad)}.kind.ingreso{background:var(--ok)}.kind.ayuda{background:var(--accent)}.kind.reto{background:var(--warn)}

/* retos */
.lvl{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lvl strong{font:800 34px var(--f-display)}
.meter{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center}
.rank li.me{font-weight:700}

/* simulador */
.verdict{border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.verdict.ok{background:var(--ok-soft)}.verdict.warn{background:var(--warn-soft)}.verdict.bad{background:var(--bad-soft)}
.verdict h2{font-size:clamp(22px,4vw,30px)}
.stack{position:relative;display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.stack i{display:block;height:100%}
.stack .a{background:var(--accent)}.stack .b{background:var(--muted)}.stack .c{background:var(--ok)}.stack .d{background:var(--bad)}
.mk{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.chk li{display:flex;gap:10px}
.chk b{flex:none;width:20px;text-align:center}
.chk .y b{color:var(--ok)}.chk .n b{color:var(--bad)}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
@media (max-width:900px){.sticky{position:static}}
.form-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}

/* planes */
.plan{display:grid;gap:12px;align-content:start}
.plan.on{border-color:var(--accent)}

/* chat */
.chatp{grid-template-rows:auto auto auto}
.chat{display:flex;flex-direction:column;gap:10px;max-height:440px;min-height:260px;overflow:auto;padding:4px}
.b{max-width:88%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--surface-2);border:1px solid var(--line);display:grid;gap:8px}
.b.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:var(--accent);border-radius:14px 14px 4px 14px}
.b.alert{border-left:4px solid var(--warn)}
.b .acts{display:flex;gap:8px;flex-wrap:wrap}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.chatform{display:flex;gap:10px}

/* onboarding y bienvenida */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:48px 32px}
@media (max-width:860px){.welcome{grid-template-columns:minmax(0,1fr);padding-block:28px}}
.welcome .lead{font-size:18px;color:var(--muted);max-width:52ch;margin-block:14px 22px}
.ob{max-width:680px;padding-block:32px 40px;display:grid;gap:18px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.err{color:var(--bad);font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* overlays */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:end center}
.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
@media (min-width:720px){.ov{place-items:center}.sheet{border-radius:16px}}
.sheet h3{margin-bottom:6px}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:4px}

/* ---------- modelo de presupuesto ---------- */
/* Cierra los meses pasados: lo que no gastaste pasa al mes siguiente y tu ahorro mensual va a tu plan */
function closeMonths(){
  var p=S.profile;if(!p||!p.inicio)return false;
  ensurePlanes();
  var cm=curMes(),k=p.inicio,carry=Math.max(0,+p.saldo||0),changed=false,guard=0;
  while(k<cm&&guard++<240){
    if(S.closed[k]){carry=S.closed[k].out;k=nextMes(k);continue;}
    var ing=sumObj(p.ingresos),fij=sumObj(p.gastos),ah=+p.ahorro||0;
    var spent=S.gastos.filter(function(g){return g.fecha.indexOf(k)===0;}).reduce(function(a,g){return a+g.importe;},0);
    var ex=extraDe(k),base=Math.max(0,ing-fij-ah)+ex,avail=base+carry,out=Math.round((avail-spent)*100)/100;   /* puede ser negativo: números rojos que se arrastran */
    S.closed[k]={base:base,carryIn:carry,extra:ex,spent:Math.round(spent*100)/100,out:out,ahorro:ah};
    if(ah>0)S.misPlanes.forEach(function(q){if(q.aporte>0)q.saved=(q.saved||0)+q.aporte;});
    carry=out;changed=true;k=nextMes(k);
  }
  return changed;
}
function extraDe(k){return Math.round((S.ingExtra||[]).filter(function(i){return i.fecha.indexOf(k)===0;}).reduce(function(a,i){return a+i.importe;},0)*100)/100;}
/* media mensual de ingresos extra en los últimos 3 meses (solo cuenta los meses que llevas usando la app) */
function extraMedio(){
  var p=S.profile;if(!p||!(S.ingExtra||[]).length)return 0;
  var t=new Date(),keys=[];for(var i=0;i<3;i++){var d=new Date(t.getFullYear(),t.getMonth()-i,1);keys.push(d.getFullYear()+'-'+pad(d.getMonth()+1));}
  keys=keys.filter(function(k){return !p.inicio||k>=p.inicio;});if(!keys.length)keys=[curMes()];
  return Math.round(keys.reduce(function(a,k){return a+extraDe(k);},0)/keys.length*100)/100;
}
function ingMedio(){return Math.round((sumObj(S.profile.ingresos)+extraMedio())*100)/100;}
function carryNow(){var cm=curMes(),keys=Object.keys(S.closed||{}).filter(function(k){return k<cm;}).sort();return keys.length?S.closed[keys[keys.length-1]].out:Math.max(0,+(S.profile&&S.profile.saldo)||0);}
function ahorroAcum(){return Object.keys(S.closed||{}).reduce(function(a,k){return a+(S.closed[k].ahorro||0);},0);}
function model(){
  var p=S.profile,now=new Date(),y=now.getFullYear(),mo=now.getMonth(),day=now.getDate(),n=dim(y,mo);
  var ingresos=sumObj(p.ingresos),fijos=sumObj(p.gastos),ahorro=+p.ahorro||0;
  var carry=carryNow(),base=Math.max(0,ingresos-fijos-ahorro);
  var prefix=y+'-'+pad(mo+1);
  var mi=(S.ingExtra||[]).filter(function(i){return i.fecha.indexOf(prefix)===0;});
  var extra=Math.round(mi.reduce(function(a,i){return a+i.importe;},0)*100)/100;
  var budget=base+carry+extra;
  var mg=S.gastos.filter(function(g){return g.fecha.indexOf(prefix)===0;});
  var spent=mg.reduce(function(a,g){return a+g.importe;},0);
  var today=ymd(now);
  var spentToday=mg.filter(function(g){return g.fecha===today;}).reduce(function(a,g){return a+g.importe;},0);
  var remaining=budget-spent,daysLeft=n-day+1;
  var allowance=(budget-(spent-spentToday))/daysLeft;
  var leftToday=allowance-spentToday;
  var ideal=budget*day/n;
  var st='ok';
  if(budget<=0||remaining<=0)st='bad';else if(spent>ideal*MODES[S.mode].tol)st='warn';
  return {ingresos:ingresos,extra:extra,mi:mi,carry:carry,base:base,fijos:fijos,ahorro:ahorro,budget:budget,spent:spent,spentToday:spentToday,remaining:remaining,daysLeft:daysLeft,allowance:allowance,leftToday:leftToday,ideal:ideal,day:day,n:n,y:y,mo:mo,mg:mg,st:st,libre:ingresos-fijos};
}

  var p=S.profile,r=a.req||{},ch=[],ex=false;
  var add=function(ok,y,n){ch.push({ok:ok,l:ok?y:n});};
  if(r.edad){var ok=p.edad>=r.edad[0]&&p.edad<=r.edad[1];add(ok,'Tienes '+p.edad+' años','Pensada para '+(r.edad[0]?r.edad[0]+' a ':'hasta ')+r.edad[1]+' años');}

  if(r.ambito&&!isUni(p.estudios))ex=true;

    S.retoHist.unshift({id:uid(),rid:id,custom:false,t:r.t,c:r.c,d:r.d,dias:r.dias,start:j.start,end:t,days:st.days,done:st.done,saved:st.saved,puntos:st.days*r.pts+(st.done?50:0),rank:arr,ejemplo:false});

function checkAlerts(fromUser){
  if(!S.profile)return;
  var m=model(),cm=curMes();
  if(S.alerts.mes!==cm)S.alerts={mes:cm,hit:[]};
  if(m.budget<=0)return;
  var pct=Math.max(0,m.remaining)/m.budget*100;
  /* si vuelves a tener más del umbral (por un ingreso, un gasto borrado...), el aviso puede volver a saltar */
  S.alerts.hit=S.alerts.hit.filter(function(t){return pct<=t;});
  /* el modo Fin de mes que se activó solo se desactiva en cuanto vuelves a superar el 5 % */
  if(S.mode==='sos'&&S.modeAuto&&pct>5){
    setSOS(false);
    toast('Has vuelto a superar el 5 %: modo Normal','ok');
    say('Vuelves a tener más del **5 %** del presupuesto ('+eur(m.remaining,2)+'), así que he vuelto al **modo Normal**.',true);
  }
  var nuevos=UMBRALES.filter(function(t){return pct<=t&&S.alerts.hit.indexOf(t)<0;});
  if(!nuevos.length)return;
  nuevos.forEach(function(t){S.alerts.hit.push(t);});
  var t=Math.min.apply(null,nuevos);
  if(S.card.alertPct){
    var msg='Te queda el '+t+' % de tu presupuesto: '+eur(m.remaining,2)+' para '+m.daysLeft+(m.daysLeft===1?' día':' días')+' ('+eur(Math.max(0,m.remaining)/m.daysLeft,2)+' al día).';
    toast('Aviso: te queda el '+t+' % del presupuesto',t<=10?'bad':'');
    say('**Aviso del '+t+' %.** '+msg,true);
    sysNotify('STUD€NTIA · te queda el '+t+' %',msg);
  }
  if(t<=5&&S.mode!=='sos'){
    setSOS(true,true);
    toast('Modo Fin de mes (SOS) activado automáticamente','bad');
    say('Te queda menos del **5 %** del presupuesto, así que he activado el **modo Fin de mes (SOS)**. Volverás a modo Normal en cuanto vuelvas a superar el 5 % (o el mes que viene).',true);
    sysNotify('Modo Fin de mes (SOS) activado','Te queda menos del 5 % del presupuesto.');

}

function gBal(g){
  var b={};g.members.forEach(function(n){b[n]=0;});
  g.exp.forEach(function(e){var c=cents(e.amt),k=e.split.length,base=Math.floor(c/k),rem=c-base*k;b[e.payer]+=c;e.split.forEach(function(w,i){b[w]-=base+(i<rem?1:0);});});

function gDebts(g){
  var b=gBal(g),cr=[],de=[],out=[],i=0,j=0;
  Object.keys(b).forEach(function(n){if(b[n]>0)cr.push([n,b[n]]);else if(b[n]<0)de.push([n,-b[n]]);});
  cr.sort(function(a,c){return c[1]-a[1];});de.sort(function(a,c){return c[1]-a[1];});
  while(i<de.length&&j<cr.length){var a=Math.min(de[i][1],cr[j][1]);out.push({from:de[i][0],to:cr[j][0],c:a});de[i][1]-=a;cr[j][1]-=a;if(de[i][1]===0)i++;if(cr[j][1]===0)j++;}
  return out;
}

/* ---------- ocio y plan de ahorro recomendado ---------- */
var OCIO_F={normal:.25,sos:0};
var ESS_SPLIT={fuera:.4,ocio:.3,compras:.3};
/* Los planes ahora son una lista que diseña el usuario. Se migra una vez el objetivo antiguo (si lo había) */
function nomPlan(q){return q.nombre||'Plan sin nombre';}
function ensurePlanes(){
  if(S.planesInit||!S.profile)return;S.planesInit=true;
  var p=S.profile,od=PLANES.filter(function(x){return x.id===p.objetivo;})[0],ah=Math.round(+p.ahorro||0);
  if(!S.misPlanes.length){
    var old=S.plans&&S.plans.mi;
    if(old&&(+old.target>0))S.misPlanes.push({id:uid(),nombre:old.nombre||'',target:+old.target,saved:+old.saved||0,months:+old.months||12,aporte:ah});
    else if(od){var st=(S.plans&&S.plans[od.id])||{};S.misPlanes.push({id:uid(),nombre:od.t,target:+st.target||od.def(),saved:+st.saved||0,months:+st.months||+p.plazo||12,aporte:ah});}
  }
  save();
}
function objDef(id){
  if(id==='mi'){var q=S.plans&&S.plans.mi;return q?{id:'mi',t:q.nombre||'Mi objetivo',def:function(){return +q.target||0;},bd:function(){return [[q.nombre||'Mi objetivo',+q.target||0]];},steps:[]}:null;}
  return PLANES.filter(function(p){return p.id===id;})[0]||null;
}
function ocioInfo(m){
  var tot=Math.max(0,m.budget)*(OCIO_F[S.mode]||0);
  var sp=m.mg.filter(function(g){return CATS[g.cat]&&!CATS[g.cat].e;}).reduce(function(a,g){return a+g.importe;},0);
  return {tot:tot,spent:sp,left:Math.max(0,tot-sp)};
}
function ocioHtml(m){
  var o=ocioInfo(m),gs=S.profile.gustos||[],picks=[],later=[];
  gs.forEach(function(k){
    var arr=OCIO[k]||[];
    var aff=arr.filter(function(a){return a[1]<=o.left;}).sort(function(a,b){return b[1]-a[1];});
    var nxt=arr.filter(function(a){return a[1]>o.left;}).sort(function(a,b){return a[1]-b[1];});
    if(aff[0])picks.push({k:k,t:aff[0][0],c:aff[0][1],L:aff[0][2]});
    if(aff[1])picks.push({k:k,t:aff[1][0],c:aff[1][1],L:aff[1][2],x:1});
    if(nxt[0])later.push({k:k,t:nxt[0][0],c:nxt[0][1],L:nxt[0][2]});
  });
  picks=picks.filter(function(x){return !x.x;}).concat(picks.filter(function(x){return x.x;})).slice(0,6);later=later.slice(0,2);
  var gl=function(k){return (GUSTOS.filter(function(g){return g[0]===k;})[0]||[k,k])[1];};
  var li=function(x,off){return '<li><span class="l">'+esc(x.t)+'<small>'+esc(gl(x.k))+'</small></span><span class="ocio-r">'+linksHtml(x.L)+'<span class="pill '+(off?'warn':'ok')+' num">'+(x.c?'≈ '+eur(x.c):'Gratis')+'</span></span></li>';};
  var intro=o.tot===0?'En modo '+MODES[S.mode].l+' solo te proponemos planes gratis.':'Este mes puedes destinar unos '+eur(o.tot)+' a ocio y te quedan '+eur(o.left)+'. Estos planes encajan con lo que te gusta y con tu margen.';
  return '<section class="panel"><h2>Ocio para ti<span class="hint num">'+eur(o.left)+' disponibles</span></h2><p class="hint">'+esc(intro)+'</p>'+
    (picks.length?'<ul class="list">'+picks.map(function(x){return li(x,false);}).join('')+'</ul>':'<p class="hint">Elige aficiones al crear tu perfil para recibir ideas.</p>')+
    (later.length?'<p class="hint">Cuando te sobre más margen:</p><ul class="list">'+later.map(function(x){return li(x,true);}).join('')+'</ul>':'')+'</section>';
}
function advice(){
  ensurePlanes();
  var p=S.profile,m=model(),libre=m.libre,floor=floorBasicos();
  var items=S.misPlanes.filter(function(q){return (+q.target||0)>0;}).map(function(q){var left=Math.max(0,q.target-(q.saved||0)),mo=Math.max(1,+q.months||12);return {q:q,left:left,months:mo,need:left>0?left/mo:0};});
  var has=items.length>0,left=items.reduce(function(a,x){return a+x.left;},0);
  var f=m.day>=7?m.n/m.day:1,sp={},tot=0,have=false;
  m.mg.forEach(function(g){if(CATS[g.cat]&&!CATS[g.cat].e){sp[g.cat]=(sp[g.cat]||0)+g.importe;have=true;}});
  Object.keys(sp).forEach(function(k){sp[k]*=f;tot+=sp[k];});
  var est=false;
  if(!have){est=true;tot=Math.max(0,(libre-floor)*0.35);sp={};Object.keys(ESS_SPLIT).forEach(function(k){sp[k]=tot*ESS_SPLIT[k];});}
  var cap=Math.max(0,libre-floor-tot);
  /* pagos que se pueden quitar o recortar, de menos a más importantes: primero suscripciones, luego gastos del día a día */
  var pot=[];
  var subs=(p.subs||[]).slice().sort(function(a,b){return b.imp-a.imp;});
  subs.forEach(function(sb){if((+sb.imp||0)>=0.5)pot.push({l:'Pausar '+sb.n,from:+sb.imp,max:+sb.imp,sub:sb.id,whole:true});});
  [['compras',.6],['fuera',.4],['ocio',.3],['otros',.5]].forEach(function(c){if(sp[c[0]]&&sp[c[0]]*c[1]>=1)pot.push({l:CATS[c[0]].l,from:sp[c[0]],max:sp[c[0]]*c[1]});});
  var potTot=pot.reduce(function(a,c){return a+c.max;},0),maxCap=cap+potTot;
  var need=has?items.reduce(function(a,x){return a+x.need;},0):Math.max(0,(libre-floor)*0.2);
  var def=Math.max(0,need-cap),got=0,cuts=[];
  pot.forEach(function(c){if(def-got<=0.5)return;var take=c.whole?c.max:Math.min(c.max,def-got);if(take<1)return;cuts.push({l:c.l,from:c.from,cut:take,sub:c.sub});got+=take;});
  var covered=maxCap>=need-0.5;
  var monthly=Math.max(0,Math.ceil(Math.min(need,maxCap)));
  var ratio=need>0?Math.min(1,monthly/need):1;
  items.forEach(function(it){it.share=it.left>0?Math.ceil(it.need*ratio):0;it.real=it.left>0?(it.share>0?Math.ceil(it.left/it.share):Infinity):0;it.ok=it.left<=0||it.real<=it.months;});
  if(has)monthly=items.reduce(function(a,x){return a+x.share;},0);
  return {plans:items,has:has,left:left,need:need,cap:cap,maxCap:maxCap,falta:Math.max(0,need-maxCap),cuts:cuts,got:got,monthly:monthly,covered:covered,libre:libre,floor:floor,tot:tot,est:est,sinMargen:libre-floor<=0,carry:m.carry};
}

  return '<section class="panel"><h2>Tu plan de ahorro recomendado<span class="hint">'+n+(n===1?' plan':' planes')+'</span></h2><div class="verdict '+cls+'"><h2>'+esc(title)+'</h2><p>'+esc(detail)+'</p></div>'+(a.sinMargen?'':planStrip(a)+plans)+tbl+cuts+carry+previewHtml(a)+

}

/* ---------- escanear ticket (OCR en el navegador) ---------- */
var tk={st:'idle'};
var TK_CAT=[['salud',/farmaci|parafarm/],['fuera',/restaur|cafeter|burger|mcdonald|telepizza|domino|starbucks|kebab|pizzer|taberna|\bbar\b|cerveceri|bocadill|vips|foster/],['transporte',/renfe|\bmetro\b|gasolin|repsol|cepsa|\bbp\b|\bshell\b|\balsa\b|\bemt\b|\btaxi\b|cabify|\buber\b|parking/],['estudios',/librer|papeler|fotocop|reprograf|casa del libro/],['ocio',/cinesa|yelmo|\bcine\b|teatro|museo/],['compras',/zara|primark|h&m|bershka|decathlon|ikea|mediamarkt|fnac|amazon|leroy/],['comida',/mercadona|carrefour|\bdia\b|lidl|aldi|alcampo|eroski|consum|supermerc|hipercor|supersol|ahorramas|froiz|gadis|panader|fruter|carnicer|pescader/]];
function tkNum(x){var m=String(x).replace(/\s/g,'').match(/^(\d{1,3}(?:[.,]\d{3})+|\d+)[.,](\d{2})$/);return m?parseFloat(m[1].replace(/[.,]/g,'')+'.'+m[2]):0;}
function tkParse(text){
  var lines=String(text||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var re=/\d{1,3}(?:[.,]\d{3})+[.,]\d{2}(?!\d)|\d+[.,]\d{2}(?!\d)/g;
  function amts(l){return (l.match(re)||[]).map(tkNum).filter(function(v){return v>0&&v<5000;});}
  var best=0,bestP=0,all=[];
  lines.forEach(function(l,i){
    var n=norm(l),a=amts(l);a.forEach(function(v){all.push(v);});
    if(/subtotal|sub total|\bbase\b|\biva\b|cuota|descuento|ahorro|entregado|cambio/.test(n))return;
    var pr=/total a pagar|a pagar|importe total/.test(n)?3:/\btotal\b/.test(n)?2:0;
    if(!pr)return;
    if(!a.length&&!/art|unid|prod/.test(n)&&lines[i+1])a=amts(lines[i+1]);
    if(a.length&&pr>bestP){bestP=pr;best=a[a.length-1];}
  });
  if(!best&&all.length)best=Math.max.apply(null,all);
  var con='';
  for(var i=0;i<Math.min(7,lines.length);i++){if(/[A-Za-zÁÉÍÓÚÑáéíóúñ]{3,}/.test(lines[i])&&!/^\W*\d/.test(lines[i])){con=lines[i].replace(/[^\wÁÉÍÓÚÑáéíóúñ&.,' -]/g,'').trim().slice(0,40);break;}}
  var t=norm(text||''),cat='otros';
  for(var k=0;k<TK_CAT.length;k++){if(TK_CAT[k][1].test(t)){cat=TK_CAT[k][0];break;}}
  var pay=/tarjeta|visa|mastercard|contactless|credito|debito/.test(t)?'tarjeta':/efectivo|cambio/.test(t)?'efectivo':'tarjeta';
  return {amt:best,con:con||'Ticket de compra',cat:cat,pay:pay};
}
function tkSet(t){var e=$('#tk-st');if(e)e.textContent=t;}
function tkLib(){return window.Tesseract?Promise.resolve():new Promise(function(ok,ko){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=function(){ko(new Error('lib'));};document.head.appendChild(sc);});}
function tkPrep(file){return new Promise(function(ok,ko){
  var u=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(u);ko(new Error('img'));};
  im.onload=function(){
    var sc=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    var x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    try{var d=x.getImageData(0,0,c.width,c.height),q=d.data;
      for(var i=0;i<q.length;i+=4){var g=0.299*q[i]+0.587*q[i+1]+0.114*q[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));q[i]=q[i+1]=q[i+2]=g;}
      x.putImageData(d,0,0);}catch(e){}
    ok(c);};
  im.src=u;});}
function tkScan(file){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('Sube una foto o captura del ticket (JPG o PNG)','bad');return;}
  tk={st:'busy',msg:'Preparando la imagen…'};render();
  tkLib().then(function(){return tkPrep(file);}).then(function(cv){
    tkSet('Leyendo el ticket…');
    return Tesseract.recognize(cv,'spa',{logger:function(m){
      if(m.status==='recognizing text')tkSet('Leyendo el ticket… '+Math.round(m.progress*100)+' %');
      else if(/load|initializ/.test(m.status))tkSet('Preparando el lector (la primera vez tarda un poco más)…');}});
  }).then(function(r){
    var p=tkParse(r.data.text);tk={st:'ready',amt:p.amt,con:p.con,cat:p.cat,pay:p.pay,raw:r.data.text};render();
    if(!p.amt)toast('No he podido leer el total: escríbelo tú','bad');
  }).catch(function(){tk={st:'err'};render();});
}

function chartSpend(m){
  if(m.budget<=0)return '<section class="panel"><h2>Cuánto llevas gastado este mes<span class="hint num">'+MESES[m.mo]+'</span></h2><p class="hint">Este mes no tienes dinero disponible, así que no hay gráfica. Llevas gastado '+eur(m.spent,2)+'.</p></section>';
  var W=640,H=250,L=58,R=14,T=16,B=30,pw=W-L-R,ph=H-T-B;
  var daily=[];for(var i=0;i<=m.n;i++)daily.push(0);
  m.mg.forEach(function(g){daily[+g.fecha.slice(8,10)]+=g.importe;});
  var cum=0,pts=[[0,0]];for(var d=1;d<=m.day;d++){cum+=daily[d];pts.push([d,cum]);}
  var maxV=Math.max(m.budget,cum,1)*1.08;
  var X=function(d){return L+d/m.n*pw;},Y=function(v){return T+ph-(v/maxV)*ph;};
  var ln=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var ar=ln+' L'+X(m.day).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
  var yt=[0,.5,1].map(function(f){var v=m.budget*f;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text class="tx" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+Math.round(v)+' €</text>';}).join('');
  var xs=[1,8,15,22,m.n].filter(function(v,i,a){return v<=m.n&&a.indexOf(v)===i;});
  var xt=xs.map(function(v){return '<text class="tx" x="'+X(v).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+v+'</text>';}).join('');
  var last=pts[pts.length-1];
  return '<section class="panel"><h2>Cuánto llevas gastado este mes<span class="hint num">'+MESES[m.mo]+'</span></h2>'+
  '<p class="hint">Hoy (día '+m.day+') llevas gastado <strong class="num">'+eur(m.spent,2)+'</strong> de los <strong class="num">'+eur(m.budget,2)+'</strong> que tienes disponibles. Si repartieras el dinero a partes iguales entre todos los días, a estas alturas llevarías <strong class="num">'+eur(m.ideal,2)+'</strong>: '+(m.spent<=m.ideal?'vas por debajo, ¡bien!':'vas por encima.')+'</p>'+
  '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto acumulado de '+eur(m.spent)+' frente a un presupuesto de '+eur(m.budget)+'">'+yt+xt+
  '<text class="tx b" x="'+(W-R)+'" y="'+(Y(m.budget)-6).toFixed(1)+'" text-anchor="end">Disponible este mes: '+eur(m.budget)+'</text>'+
  '<path d="'+ar+'" fill="var(--accent-soft)" stroke="none"/>'+
  '<line x1="'+X(0).toFixed(1)+'" y1="'+Y(0).toFixed(1)+'" x2="'+X(m.n).toFixed(1)+'" y2="'+Y(m.budget).toFixed(1)+'" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>'+
  '<path d="'+ln+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
  '<circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>'+

/* simulador */
function simOut(){
  var s=simInit(),c=simCalc(s,s.n),p=S.profile;
  var verdict=c.ok?'ok':c.ratio<=0.40?'warn':'bad';
  var pct=isFinite(c.ratio)?Math.round(c.ratio*100):0;
  var minInc=c.net/0.30,maxShare=0.30*s.ingresos+(c.elig&&s.bono?250:0);
  var title=c.ok?'Sí te salen las cuentas':verdict==='warn'?'Casi: te pasas del 30 %':'Todavía no te salen';
  var detail=c.ok?'Pagarías '+eur(c.net)+' de alquiler al mes, el '+pct+' % de tus ingresos.':'Pagarías '+eur(c.net)+' al mes ('+(isFinite(c.ratio)?pct+' % de tus ingresos':'no hay ingresos')+'). Necesitas '+eur(minInc)+' al mes de ingresos o un alquiler de hasta '+eur(maxShare)+' por persona.';
  var total=c.net+s.vida,scale=Math.max(s.ingresos,total,1),libre=Math.max(0,s.ingresos-total),def=Math.max(0,total-s.ingresos);
  var w=function(v){return (v/scale*100).toFixed(2)+'%';};
  var stack='<div class="stack" role="img" aria-label="Reparto de tus ingresos"><i class="a" style="width:'+w(c.net)+'"></i><i class="b" style="width:'+w(s.vida)+'"></i>'+(libre?'<i class="c" style="width:'+w(libre)+'"></i>':'')+(def?'<i class="d" style="width:'+w(0)+'"></i>':'')+'<span class="mk" style="left:'+(0.30*s.ingresos/scale*100).toFixed(2)+'%" title="30 % de tus ingresos"></span></div>'+
    '<div class="legend"><span><span class="kind" style="background:var(--accent)"></span>Alquiler '+eur(c.net)+'</span><span><span class="kind"></span>Gastos de vida '+eur(s.vida)+'</span>'+(libre?'<span><span class="kind ingreso"></span>Te sobran '+eur(libre)+'</span>':'<span><span class="kind gasto"></span>Te faltan '+eur(def)+'</span>')+'<span>Línea discontinua: 30 % de tus ingresos</span></div>';
  var W=560,H=230,L=40,R=10,T=18,B=34,pw=W-L-R,ph=H-T-B,bw=pw/6;
  var Y=function(v){return T+ph-Math.min(1,v)*ph;};
  var bars='';
  for(var n=1;n<=6;n++){
    var r=simCalc(s,n),v=isFinite(r.ratio)?r.ratio:1,x=L+(n-1)*bw+bw*0.18,bwid=bw*0.64,top=Y(v);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+(Y(0)-top).toFixed(1)+'" fill="'+(r.ok?'var(--ok)':'var(--bad)')+'" rx="2"/>'+
      '<text class="tx b" x="'+(x+bwid/2).toFixed(1)+'" y="'+(top-5).toFixed(1)+'" text-anchor="middle">'+(v>=1?'+100':Math.round(v*100))+' %</text>'+
      '<text class="tx" x="'+(x+bwid/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle">'+n+(n===1?' persona':' personas')+'</text>';
  }
  var yl=[0,.3,.6,1].map(function(f){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(f).toFixed(1)+'" y2="'+Y(f).toFixed(1)+'" stroke="'+(f===.3?'var(--ink)':'var(--line)')+'" stroke-width="'+(f===.3?1.5:1)+'" '+(f===.3?'stroke-dasharray="5 4"':'')+'/><text class="tx'+(f===.3?' b':'')+'" x="'+(L-6)+'" y="'+(Y(f)+4).toFixed(1)+'" text-anchor="end">'+Math.round(f*100)+'%</text>';}).join('');
  var chart='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Porcentaje de tus ingresos que se va en alquiler según con cuántas personas compartas piso">'+yl+bars+'</svg><div class="legend"><span><span class="kind ingreso"></span>Dentro del 30 %</span><span><span class="kind gasto"></span>Por encima del 30 %</span></div>';
  var li=function(ok,t){return '<li class="'+(ok?'y':'n')+'"><b aria-hidden="true">'+(ok?'✓':'✗')+'</b><span>'+t+'</span></li>';};
  var checks='<ul class="chk">'+li(c.ageOk,'Edad entre 18 y 35 años ('+p.edad+')')+li(c.incOk,'Ingresos por debajo de 3 veces el IPREM (unos 2.100 € al mes)')+li(c.rentOk,s.tipo==='habitacion'?'Tu parte del alquiler ('+eur(c.share)+') no supera el tope de '+eur(s.tope):'El alquiler total ('+eur(s.rent)+') no supera el tope de '+eur(s.tope))+'</ul>';
  var bdA=objDef('piso').bd(),needA=bdA.reduce(function(a,x){return a+x[1];},0),haveA=+s.ahorrado||0,faltaA=Math.max(0,needA-haveA),margenA=s.ingresos-total,mesesA=faltaA>0&&margenA>0?Math.ceil(faltaA/margenA):0;
  var ahorroPanel='<section class="panel"><h2>Ahorro que deberías tener antes de emanciparte<span class="num">'+eur(needA)+'</span></h2><ul class="list">'+bdA.map(function(x){return '<li><span class="l">'+esc(x[0])+'</span><span class="num">'+eur(x[1])+'</span></li>';}).join('')+'<li><span class="l"><strong>Ya tienes ahorrado</strong></span><span class="num">'+eur(haveA)+'</span></li><li><span class="l"><strong>'+(faltaA>0?'Te faltan':'Ya llegas')+'</strong></span><span class="num">'+eur(faltaA)+'</span></li></ul><p class="hint">'+(faltaA<=0?'Con lo que tienes ya cubres la entrada a un piso.':margenA>0?'Con lo que te sobra al mes ('+eur(margenA)+') lo conseguirías en unos '+fmtMeses(mesesA)+'.':'Con tus gastos actuales no te sobra dinero al mes para ahorrar lo que falta.')+'</p></section>';
  return '<div class="verdict '+verdict+'"><h2>'+title+'</h2><p>'+detail+'</p></div>'+ahorroPanel+
    '<section class="panel"><h2>Cómo se reparten tus ingresos</h2>'+stack+'</section>'+
    '<section class="panel"><h2>Según con cuántas personas compartas</h2>'+chart+'</section>'+
    '<section class="panel"><h2>Requisitos del Bono Alquiler Joven</h2>'+checks+'<p class="hint">Los topes de alquiler cambian según la comunidad. Algunas, como Madrid, Cataluña o Baleares, los han subido. Ajusta el tope a tu convocatoria.</p></section>';
}

function planInfo(def){

function calculateIntereses() {
  var capInput = document.getElementById('sim-cap');
  if (!capInput) return;
  var cap = parseFloat(capInput.value) || 0;
  var rate = parseFloat(document.getElementById('sim-rate').value) || 0;
  var years = parseFloat(document.getElementById('sim-years').value) || 0;
  var type = document.getElementById('sim-type').value;

  var total = 0;
  var interest = 0;

  if (type === 'simple') {
    interest = cap * (rate / 100) * years;
    total = cap + interest;
  } else {
    total = cap * Math.pow((1 + (rate / 100)), years);
    interest = total - cap;
  }

  var fmt = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });

  document.getElementById('res-cap').textContent = fmt.format(cap);
  document.getElementById('res-int').textContent = '+' + fmt.format(interest);
  document.getElementById('res-tot').textContent = fmt.format(total);

  var capPct = total > 0 ? (cap / total) * 100 : 0;
  var intPct = total > 0 ? (interest / total) * 100 : 0;

  document.getElementById('bar-cap').style.width = capPct + '%';
  document.getElementById('bar-int').style.width = intPct + '%';
}

function validate(d){
  if(d.step===0){
    if(!d.nombre.trim())return 'Escribe tu nombre.';
    var e=parseInt(d.edad,10);if(!(e>=14&&e<=60))return 'Escribe una edad entre 14 y 60 años.';
    if(!d.ccaa)return 'Elige tu comunidad autónoma.';
    if(isUni(d.estudios)){
      if(!d.centro)return 'Elige tu universidad.';
      if(!d.ambito)return 'Elige el ámbito de tus estudios.';
    }
  }
  if(d.step===2){for(var si=0;si<d.subs.length;si++){var s=d.subs[si];if(!String(s.n).trim()&&!num(s.imp))continue;if(!String(s.n).trim())return 'Escribe el nombre de cada suscripción.';if(!num(s.imp))return 'Escribe cuánto pagas por '+s.n+'.';var dd=parseInt(s.dia,10);if(!(dd>=1&&dd<=31))return 'El día de cobro de '+s.n+' va de 1 a 31.';}}
  if(d.step===1){var s=num(d.ingresos.trabajo)+num(d.ingresos.familia)+num(d.ingresos.otros);if(s<=0)return 'Indica al menos una fuente de ingresos.';var dia=parseInt(d.diaCobro,10);if(!(dia>=1&&dia<=31))return 'El día de cobro va de 1 a 31.';if(num(d.ingresos.otros)>0&&!d.otrosIngTxt.trim())return 'Cuéntanos a qué se refiere el ingreso de «Otros».';}
  if(d.step===2){if(num(d.gastos.otros)>0&&!d.otrosGasTxt.trim())return 'Cuéntanos a qué se refiere el gasto de «Otros fijos».';}
  if(d.step===3){if(!d.gustos.length)return 'Elige al menos una cosa que te guste hacer en tu tiempo libre.';}
  return '';
}

}
function send(text){
  text=String(text||'').trim();if(!text)return;
  S.chat.push({r:'u',t:text});if(AI_ON()&&!isCmd(text)){aiAsk(text);return;}var r=bot(text);if(sb&&!CL()&&!isCmd(text)){r.t+='\n(Respuesta básica. Inicia sesión en Grupos para activar el asistente con IA.)';r.acts=(r.acts||[]).concat([{l:'Iniciar sesión',h:'#grupos'}]);}S.chat.push({r:'a',t:r.t,acts:r.acts||[]});save();
  if(curView()!=='asistente'){render();return;}
  render();var i=$('#chat-in');if(i)i.focus();
}

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  if(k==='gasto'){var a=num($('#qa-amt').value);if(!a){toast('Escribe un importe mayor que cero','bad');return;}addGasto(a,$('#qa-cat').value,$('#qa-con').value.trim(),$('#qa-pay').value);}
  if(k==='ticket'){var ta=num($('#tk-amt').value);if(!ta){toast('Escribe un importe mayor que cero','bad');return;}var tp=$('#tk-pay').value;if(!(S.card.blocked&&tp==='tarjeta'))tk={st:'idle'};addGasto(ta,$('#tk-cat').value,$('#tk-con').value.trim().slice(0,40),tp);return;}
  if(k==='ingreso'){var ia=num($('#qi-amt').value);if(!ia){toast('Escribe un importe mayor que cero','bad');return;}addIngreso(ia,$('#qi-tipo').value,$('#qi-con').value.trim());}
  if(k==='tope'){var tv=Math.max(0,num(new FormData(f).get('v'))||0);S.topeDia=Math.round(tv*100)/100;save();render();toast(S.topeDia>0?'Máximo diario guardado: '+eur(S.topeDia,2):'Máximo diario quitado','ok');return;}
  if(k==='saldo'){var sv=num(new FormData(f).get('v')),pp=S.profile,sd=sv-(+pp.saldo||0);pp.saldo=sv;
    Object.keys(S.closed||{}).forEach(function(c){var x=S.closed[c];x.carryIn=Math.round(((x.carryIn||0)+sd)*100)/100;x.out=Math.round(((x.out||0)+sd)*100)/100;});
    save();render();toast('Dinero en cuenta actualizado','ok');return;}
  if(k==='locadd'){var lk=f.dataset.k,ln=String(new FormData(f).get('n')||'').trim().slice(0,20),lm=activeMy().filter(function(x){return x.id===lk;})[0];
    if(!ln){toast('Escribe un nombre','bad');return;}
    var lt=(ln.toLowerCase()==='tú'||ln.toLowerCase()==='tu')||(lm&&lm.shared&&lm.amigos.indexOf(ln)>=0)||(lm&&!lm.shared&&lm.amigos.indexOf(ln)>=0)||(S.locPeople[lk]&&S.locPeople[lk][ln]);
    if(lt){toast('Ya hay alguien con ese nombre en este reto','bad');return;}
    if(lm&&!lm.shared){lm.amigos.push(ln);lm.p[ln]=[];}else{(S.locPeople[lk]=S.locPeople[lk]||{})[ln]=[];}
    save();render();toast(ln+' añadido al reto','ok');return;}
  if(k==='reto'){var rt=$('#rt-t').value.trim().slice(0,40),rd=parseInt($('#rt-n').value,10);if(!rt){toast('Ponle un nombre al reto','bad');return;}if(!(rd>=1&&rd<=365)){toast('La duración va de 1 a 365 días','bad');return;}
    if($('#rt-sh')&&$('#rt-sh').checked){cloudNewReto(rt,$('#rt-d').value.trim().slice(0,160),rd,num($('#rt-e').value));return;}
    var am=[];$('#rt-a').value.split(',').forEach(function(x){x=x.trim().slice(0,20);if(x&&x!=='Tú'&&am.indexOf(x)<0&&am.length<8)am.push(x);});
    var pp={'Tú':[]};am.forEach(function(a){pp[a]=[];});
    S.myRetos.push({id:uid(),t:rt,d:$('#rt-d').value.trim().slice(0,160),dias:rd,est:num($('#rt-e').value),start:ymd(new Date()),amigos:am,p:pp});save();render();toast('Reto creado','ok');}
  if(k==='addamigo'){var ac=$('#am-code').value.trim().toLowerCase();if(!ac){toast('Escribe el código de tu amigo','bad');return;}cloudDo(function(){return sb.rpc('pedir_amistad',{cod:ac,mi_nombre:S.profile.nombre});},'Solicitud enviada');return;}
  if(k==='joinreto'){var jr=$('#jr-code').value.trim().toLowerCase();if(!jr){toast('Escribe el código del reto','bad');return;}cloudDo(function(){return sb.rpc('unirse_reto',{cod:jr,mi_nombre:S.profile.nombre});},'Te has unido al reto');return;}
  if(k==='evento'){var t=$('#ev-title').value.trim(),dt=$('#ev-date').value;if(!t||!dt)return;S.events.push({id:uid(),title:t,date:dt,kind:$('#ev-kind').value,amt:num($('#ev-amt').value),guests:$('#ev-guests').value.trim().replace(/\s+/g,'')});calSel=dt;var p=parse(dt);calCur={y:p.getFullYear(),m:p.getMonth()};save();render();toast('Evento guardado','ok');}
  if(k==='auth'){cloudAuth('in',$('#au-mail').value.trim(),$('#au-pass').value);return;}
  if(k==='join'){var jc=$('#jn-code').value.trim().toLowerCase();cloudDo(function(){return sb.rpc('unirse_grupo',{cod:jc,mi_nombre:S.profile.nombre});},'Te has unido al grupo');return;}
  if(k==='grupo'){var fd=new FormData(f),gn=String(fd.get('name')||'').trim(),ms=fd.getAll('m').map(String),gx=String(fd.get('extra')||'').trim().slice(0,20);if(!gn){toast('Ponle un nombre al grupo','bad');return;}if(gx&&gx!==ME&&ms.indexOf(gx)<0)ms.push(gx);if(CL()){cloudNewGroup(gn.slice(0,40),ms);return;}var ng={id:uid(),name:gn.slice(0,40),members:[ME].concat(ms),exp:[],paid:[]};S.groups.push(ng);gSel=ng.id;save();render();toast('Grupo creado','ok');return;}
  if(k==='gexp'){var fe=new FormData(f),ge=gl().filter(function(x){return x.id===f.dataset.g;})[0],ga=num(fe.get('amt')),gw=fe.getAll('w').map(String),gt=String(fe.get('what')||'').trim();if(!ge||!ga||!gw.length||!gt){toast('Escribe concepto, importe y con quién se reparte','bad');return;}if(CL()){cloudAddExp(ge,gt.slice(0,40),ga,String(fe.get('payer')),gw);return;}ge.exp.push({id:uid(),what:gt.slice(0,40),amt:ga,payer:String(fe.get('payer')),split:gw,date:ymd(new Date())});save();render();toast('Gasto añadido','ok');return;}
  if(k==='chat'){var i=$('#chat-in');var v=i.value;i.value='';send(v);}
  if(k==='sub'){var sn=$('#sb-n').value.trim().slice(0,30),si=num($('#sb-imp').value),sd=parseInt($('#sb-dia').value,10);if(!sn||!si||!(sd>=1&&sd<=31)){toast('Escribe el servicio, el precio y el día de cobro (1-31)','bad');return;}var pp=S.profile;pp.subs.push({id:uid(),n:sn,imp:si,dia:sd});pp.gastos.suscripciones=subsSum(pp.subs);save();render();toast('Suscripción añadida: se cobra el día '+sd,'ok');}
});
function onInput(e){
  var el=e.target;
  if(el.dataset.d&&D){var v=el.value;if(el.dataset.d==='gusto')return;setPath(D,el.dataset.d,v);if(el.id==='o-i4'){var w1=$('#o-i4t-w');if(w1)w1.hidden=!(num(v)>0);}if(el.id==='o-g5'){var w2=$('#o-g5t-w');if(w2)w2.hidden=!(num(v)>0);}}
  if(el.id==='sb-n'){var si2=$('#sb-imp');if(si2&&!si2.value&&subPrice(el.value))si2.value=subPrice(el.value);}
  if(el.dataset.sub&&D){var pr=el.dataset.sub.split('.'),it=D.subs[+pr[0]];if(it){it[pr[1]]=el.value;if(pr[1]==='n'&&!num(it.imp)&&subPrice(el.value)){it.imp=String(subPrice(el.value));var ii=$('#o-sub-imp-'+pr[0]);if(ii)ii.value=it.imp;}var tt=$('#o-subs-tot');if(tt)tt.textContent=eur(D.subs.reduce(function(a,s){return a+num(s.imp);},0),2);}}
  if(el.dataset.mi){var qq=S.misPlanes.filter(function(x){return x.id===el.dataset.pid;})[0];if(qq){var kk=el.dataset.mi;
    if(kk==='nombre')qq.nombre=el.value.trim().slice(0,40);else if(kk==='months')qq.months=Math.min(240,Math.max(1,Math.round(num(el.value))||1));else qq[kk]=Math.max(0,num(el.value));
    save();$('#mi-out').innerHTML=adviceHtml();}}
  if(el.dataset.sim){var s=simInit(),k=el.dataset.sim;if(k==='bono')s.bono=el.checked;else if(k==='tipo'){s.tipo=el.value;s.tope=el.value==='habitacion'?300:600;var tp=$('#sm-tope');if(tp)tp.value=s.tope;}else if(k==='n'){s.n=+el.value;$('#sm-n-o').textContent=s.n;}else s[k]=num(el.value);save();$('#sim-out').innerHTML=simOut();}
}
document.addEventListener('input',function(e){onInput(e); var el=e.target;
  if(el.id==='sim-cap'||el.id==='sim-rate'||el.id==='sim-years'){calculateIntereses();}
});
document.addEventListener('change',function(e){
  var el=e.target;
  
  if(el.id==='sim-type'){calculateIntereses();}
  if(el.id==='tk-file'){var fl=el.files&&el.files[0];el.value='';tkScan(fl);return;}

  if(el.dataset.plan){var d=PLANES.filter(function(p){return p.id===el.dataset.plan;})[0],i=planInfo(d),st=S.plans[d.id]||{on:false,target:i.target,months:i.months,saved:i.saved},k=el.dataset.k;st[k]=num(el.value);S.plans[d.id]=st;if(k==='precio')st.target=d.def();if(k==='months'&&S.profile.objetivo===d.id)S.profile.plazo=st.months;save();render();}
  if(el.dataset.d&&el.tagName==='SELECT'&&D){var wasUni=isUni(D.estudios);setPath(D,el.dataset.d,el.value);if(el.dataset.d==='ccaa'){if(isUni(D.estudios)){D.centro='';D.ambito='';}D.err='';render();}else if(el.dataset.d==='centro'){D.err='';render();}else if(el.dataset.d==='estudios'){if(wasUni!==isUni(D.estudios)){D.centro='';D.ambito='';}D.err='';render();}}
});
window.addEventListener('hashchange',function(){render(false);if((location.hash==='#retos'||location.hash==='#grupos')&&CL())cloudLoad().then(function(){render();});});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sos').hidden)closeSOS();});
document.addEventListener('click',function(e){var o=$('#sos');if(!o.hidden&&e.target===o)closeSOS();});

/* gesto de deslizar */
var drag=null;
document.addEventListener('pointerdown',function(e){
  var c=e.target.closest('.swipe-top');if(!c||e.target.closest('summary,button,a'))return;
  drag={c:c,x:e.clientX,dx:0};c.classList.add('drag');try{c.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;drag.dx=e.clientX-drag.x;
  drag.c.style.transform='translateX('+drag.dx+'px) rotate('+(drag.dx/18)+'deg)';
  if(Math.abs(drag.dx)>30)drag.c.dataset.dir=drag.dx>0?'r':'l';else delete drag.c.dataset.dir;
});
function endDrag(){
  if(!drag)return;var c=drag.c,dx=drag.dx;drag=null;c.classList.remove('drag');delete c.dataset.dir;
  if(Math.abs(dx)>100)decide(dx>0?'r':'l');else c.style.transform='';
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- avisos: mira cada 30 s si te han invitado a algo ---------- */
var redSig='';
function redSign(){return redOk()?cloud.red.recibidas.length+'|'+cloud.red.invitaciones.map(function(i){return i.id;}).join(','):'';}
async function pollRed(){
  if(!CL()||document.hidden)return;
  redSig=redSign();var prevN=nGrupos()+nRetosInv();
  await cloudLoadRed();
  if(redSign()===redSig)return;
  var ae=document.activeElement,typing=ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  if(typing){$$('.tab').forEach(function(a){var v=(a.getAttribute('href')||'').slice(1),old=a.querySelector('.nb');if(old)old.remove();var h=nbadge(v);if(h)a.insertAdjacentHTML('beforeend',h);});}
  else render();
  var n=nGrupos()+nRetosInv();if(n>prevN)toast('Tienes '+n+(n===1?' notificación nueva':' notificaciones nuevas')+' (invitaciones o solicitudes)','ok');
}
setInterval(pollRed,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pollRed();});

/* ---------- arranque ---------- */
if(S.profile)digest();
render(false);
cloudInit();
})();
