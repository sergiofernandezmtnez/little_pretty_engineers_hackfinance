<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.15;margin:0}
h1{font-size:1.8rem;font-weight:800}h2{font-size:1.15rem;font-weight:800;margin-bottom:10px}
button,nav a{font:600 .95rem Figtree,sans-serif;padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
button.p,nav a.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
button[disabled]{opacity:.4;cursor:default}

input,select{font:inherit;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.mut{color:var(--mut)}
.tag{display:inline-block;background:var(--warn);color:#14213D;padding:3px 10px;border-radius:999px;font-weight:600;font-size:.85rem;margin:0 6px 6px 0}
/* --- Cuestionario --- */
#ob{max-width:620px;margin:0 auto;padding:24px 18px 60px}
#ob input[type=text],#ob input[type=number],#ob select{width:100%}
.track{display:flex;gap:6px;margin:18px 0 6px}.seg{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--acc);transition:width .35s}
.bname{font-weight:600;color:var(--acc);margin:0 0 12px}.help{color:var(--mut);margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--acc);background:var(--sel)}.opt input{accent-color:var(--acc);width:20px;height:20px;margin:0}
.imp{display:flex;align-items:center;gap:12px;margin-bottom:10px}.imp span{flex:1}.imp input{width:130px!important}
.obnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.err{color:#D1432B;min-height:1.4em;margin:10px 0 0}
/* --- Pantalla principal --- */
#db header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:20px 18px 6px}
#db nav{display:flex;gap:8px;flex-wrap:wrap}
#grid{max-width:1080px;margin:0 auto;padding:12px 18px 60px;display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:820px){#grid>*{grid-column:span 12!important}}
.big{font:800 2rem "Bricolage Grotesque",sans-serif;line-height:1.1}
.estado{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:600;color:#14213D}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.kpis small{display:block;color:var(--mut)}
.pie{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.pie svg{width:190px;height:190px;flex:none}
.leg{flex:1;min-width:170px;display:grid;gap:6px}.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}.leg b{margin-left:auto}
.prog{height:14px;border-radius:10px;background:var(--line);overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;background:var(--acc)}
.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}
form.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input[type=number].s{width:110px}
.chat{height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.m{padding:8px 12px;border-radius:14px;max-width:85%}.m.b{background:var(--sel)}.m.u{background:var(--acc);color:var(--accInk);align-self:flex-end}
.chat+form{margin-top:0}.chat+form input{flex:1;min-width:0}
@media(prefers-reduced-motion:reduce){.seg i{transition:none}}
</style>
</head>

function gBal(g){
  var b={};g.members.forEach(function(n){b[n]=0;});
  g.exp.forEach(function(e){var c=cents(e.amt),k=e.split.length,base=Math.floor(c/k),rem=c-base*k;b[e.payer]+=c;e.split.forEach(function(w,i){b[w]-=base+(i<rem?1:0);});});

function gDebts(g){
  var b=gBal(g),cr=[],de=[],out=[],i=0,j=0;
  Object.keys(b).forEach(function(n){if(b[n]>0)cr.push([n,b[n]]);else if(b[n]<0)de.push([n,-b[n]]);});
  cr.sort(function(a,c){return c[1]-a[1];});de.sort(function(a,c){return c[1]-a[1];});
  while(i<de.length&&j<cr.length){var a=Math.min(de[i][1],cr[j][1]);out.push({from:de[i][0],to:cr[j][0],c:a});de[i][1]-=a;cr[j][1]-=a;if(de[i][1]===0)i++;if(cr[j][1]===0)j++;}
  return out;
}

function chartSpend(m){

  var cum=0,pts=[[0,0]];for(var d=1;d<=m.day;d++){cum+=daily[d];pts.push([d,cum]);}
  var maxV=Math.max(m.budget,cum,1)*1.08;
  var X=function(d){return L+d/m.n*pw;},Y=function(v){return T+ph-(v/maxV)*ph;};
  var ln=pts.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ');
  var ar=ln+' L'+X(m.day).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(0).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
  var yt=[0,.5,1].map(function(f){var v=m.budget*f;return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text class="tx" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';}).join('');
  var xs=[1,8,15,22,m.n].filter(function(v,i,a){return v<=m.n&&a.indexOf(v)===i;});

  var last=pts[pts.length-1];
  return '<section class="panel"><h2>Tu mes día a día<span class="hint num">'+MESES[m.mo]+'</span></h2>'+
  '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto acumulado de '+eur(m.spent)+' frente a un presupuesto de '+eur(m.budget)+'">'+yt+xt+
  '<text class="tx b" x="'+(W-R)+'" y="'+(Y(m.budget)-6).toFixed(1)+'" text-anchor="end">Presupuesto '+eur(m.budget)+'</text>'+
  '<path d="'+ar+'" fill="var(--accent-soft)" stroke="none"/>'+
  '<line x1="'+X(0).toFixed(1)+'" y1="'+Y(0).toFixed(1)+'" x2="'+X(m.n).toFixed(1)+'" y2="'+Y(m.budget).toFixed(1)+'" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>'+
  '<path d="'+ln+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+

}
