# Actualiza la función del chat en Supabase cuando cambias supabase/functions/**
name: Publicar función del chat

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jvytaiwnyjyvxjpjhcce
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # La función comprueba por sí misma que quien escribe tiene la sesión iniciada
      - run: supabase functions deploy chat --project-ref "$PROJECT_REF" --no-verify-jwt
