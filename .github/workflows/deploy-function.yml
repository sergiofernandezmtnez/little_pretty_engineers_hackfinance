# Actualiza las funciones del asistente en Supabase (chat y voz) cuando cambias supabase/functions/**
name: Publicar funciones del asistente (chat y voz)

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jvytaiwnyjyvxjpjhcce
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Cada función comprueba por sí misma que quien llama tiene la sesión iniciada
      - run: supabase functions deploy chat --project-ref "$PROJECT_REF" --no-verify-jwt
      # Voz del asistente (ElevenLabs). Sus secretos se ponen aparte con "supabase secrets set" (ver README)
      - run: supabase functions deploy tts --project-ref "$PROJECT_REF" --no-verify-jwt
