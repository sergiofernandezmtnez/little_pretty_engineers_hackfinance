# Publica la web en GitHub Pages cada vez que haces push a la rama principal.
name: Publicar web

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Solo se publica lo que la web necesita (no server.py, ni los .sql, ni el README)
      - name: Preparar carpeta pública
        run: |
          mkdir site
          cp index.html site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
